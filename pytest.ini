[pytest]
# Generate a clickable HTML report after every run (requires pytest-html,
# installed below). Open report.html in a browser to see results visually
# instead of scrolling terminal output.
addopts = --html=report.html --self-contained-html --reruns 1

# --reruns 1 means: if a test fails, automatically try it one more time
# before marking it as truly failed. This handles "flaky" failures caused
# by timing/network hiccups rather than a real bug — very common in real
# browser automation. (Requires pytest-rerunfailures, installed below.)

testpaths = tests
